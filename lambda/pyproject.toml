[project]
name = "vault-secrets-sync"
version = "0.1.0"
description = "Sync Vault KV v2 secrets to AWS Secrets Manager using IAM outbound identity federation"
requires-python = ">=3.13"
# boto3 is bundled because sts:GetWebIdentityToken needs a newer SDK than the Lambda runtime may ship.
dependencies = ["boto3>=1.42"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_secrets_sync"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
